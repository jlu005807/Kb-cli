[workspace]
members = [
  "crates/kb-cli",
  "crates/kb-core",
  "crates/kb-storage-fs",
  "crates/kb-storage-sqlite",
  "crates/kb-index-memory",
  "crates/kb-llm",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
rust-version = "1.89"

[workspace.dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
insta = "1.43.2"
serde_json = "1.0.145"
