[workspace]
members = [
  "crates/kb-cli",
  "crates/kb-core",
  "crates/kb-storage-fs",
  "crates/kb-index-memory",
  "crates/kb-llm",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
insta = "1.43.2"
serde_json = "1.0.145"
similar = "2.7.0"
