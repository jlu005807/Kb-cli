name: ci

on:
  push:
    branches:
      - main
  pull_request:

# Superseded runs on the same ref are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # A hung test must not burn the 6-hour runner default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Lint first: fails fast and shares the dependency build with the test step.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test package target-directory handling
        run: node --test tests/tools/packaging.test.js

      - name: Test Linux package installation and workflows
        if: runner.os == 'Linux'
        run: |
          bash ./scripts/package.sh --target x86_64-unknown-linux-gnu --dist-dir target/ci-dist
          node ./tests/tools/test-package-environment.js target/ci-dist/*.tar.gz

      - name: Test Windows package installation and workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Profile debug -DistDir target/ci-dist -SkipBuild
          node ./tests/tools/test-package-environment.js (Get-ChildItem target/ci-dist/*.zip | Select-Object -First 1 -ExpandProperty FullName)

  doc-fixtures:
    name: Doc Fixture Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node is preinstalled on GitHub runners; the script needs no dependencies.
      - name: Test and validate CLI doc fixtures
        run: node --test tests/tools/validate-doc-fixture-diff.test.js tests/tools/release-workflow.test.js

      - name: Validate CLI doc examples against fixtures
        run: node tests/tools/validate-doc-fixture-diff.js
