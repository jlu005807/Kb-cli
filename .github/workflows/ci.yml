name: ci

on:
  push:
    branches:
      - main
  pull_request:

# Superseded runs on the same ref are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # A hung test must not burn the 6-hour runner default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Lint first: fails fast and shares the dependency build with the test step.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  doc-fixtures:
    name: Doc Fixture Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node is preinstalled on GitHub runners; the script needs no dependencies.
      - name: Test and validate CLI doc fixtures
        run: node --test tests/tools/validate-doc-fixture-diff.test.js

      - name: Validate CLI doc examples against fixtures
        run: node tests/tools/validate-doc-fixture-diff.js
