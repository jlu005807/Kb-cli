name: release

on:
  create:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ github.event.ref }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v') }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate Release Tag
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "RELEASE_TAG is empty" >&2
            exit 1
          fi

          version=$(awk '
            /^\[workspace\.package\]/ { package = 1; next }
            /^\[/ && package { exit }
            package && $1 == "version" { gsub(/["\r]/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match workspace version $version" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid RELEASE_TAG: $RELEASE_TAG" >&2
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v0.1.0)" >&2
            exit 1
          fi

      - name: Prepare Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already public; refusing to overwrite it" >&2
              exit 1
            fi
          else
            notes_file="docs/releases/$RELEASE_TAG.md"
            if [[ -f "$notes_file" ]]; then
              notes_args=(--notes-file "$notes_file")
            else
              notes_args=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" "${notes_args[@]}" --draft --verify-tag
          fi

  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    if: ${{ github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build and Package (Linux)
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu

      - name: Test Linux package installation and workflows
        run: node ./tests/tools/test-package-environment.js dist/*.tar.gz

      - name: Upload Linux Asset To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --repo "$GH_REPO" --clobber

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    needs:
      - prepare-release
    if: ${{ github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and Package (Windows)
        shell: pwsh
        run: ./scripts/package.ps1 -Target x86_64-pc-windows-msvc

      - name: Test Windows package installation and workflows
        shell: pwsh
        run: |
          node ./tests/tools/test-package-environment.js (Get-ChildItem dist/*.zip | Select-Object -First 1 -ExpandProperty FullName)

      - name: Upload Windows Asset To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" dist/*.zip --repo "$env:GH_REPO" --clobber

  publish-release:
    name: Publish Accepted Packages
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
