name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build and Package (Linux)
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-package
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and Package (Windows)
        shell: pwsh
        run: ./scripts/package.ps1 -Target x86_64-pc-windows-msvc

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Validate Release Tag
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "RELEASE_TAG is empty" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid RELEASE_TAG: $RELEASE_TAG" >&2
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v0.1.0)" >&2
            exit 1
          fi

      - name: Download Linux Artifact
        uses: actions/download-artifact@v5
        with:
          name: linux-package
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v5
        with:
          name: windows-package
          path: release-assets

      - name: Create Release If Missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --generate-notes

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
