name: release

on:
  create:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ github.event.ref }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v') }}
    steps:
      - name: Validate Release Tag
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "RELEASE_TAG is empty" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid RELEASE_TAG: $RELEASE_TAG" >&2
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v0.1.0)" >&2
            exit 1
          fi

      - name: Create Release If Missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --generate-notes

  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    if: ${{ github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build and Package (Linux)
        run: bash ./scripts/package.sh --target x86_64-unknown-linux-gnu

      - name: Test Linux package installation and workflows
        run: node ./tests/tools/test-package-environment.js dist/*.tar.gz

      - name: Upload Linux Asset To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --repo "$GH_REPO" --clobber

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    needs:
      - prepare-release
    if: ${{ github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and Package (Windows)
        shell: pwsh
        run: ./scripts/package.ps1 -Target x86_64-pc-windows-msvc

      - name: Test Windows package installation and workflows
        shell: pwsh
        run: |
          node ./tests/tools/test-package-environment.js (Get-ChildItem dist/*.zip | Select-Object -First 1 -ExpandProperty FullName)

      - name: Upload Windows Asset To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" dist/*.zip --repo "$env:GH_REPO" --clobber
